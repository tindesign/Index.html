<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 5px;
            padding-bottom: 0px;
        }

        body {
            background-color: white;
            font-family: 'Times New Roman', Times, serif;

        }

        .logoku {
            padding: 20px;
            color: white;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 10px;
            color: white;
            text-decoration: none;
        }

        .menu a {
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 18px;
            background-color: darkblue;
            margin-bottom: 0;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            color: white;
            background-color: darkblue;
            margin-bottom: 0;
        }

        .navbar a {
            text-decoration: none;
        }

        .footer a {
            text-decoration: none;
            color: white;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: bisque;
            padding-top: 50px;
            gap: 20px;
            padding-bottom: 20px;
        }

        .button {
            background-color: orange;
            border-radius: 20px;
            height: 35px;
            width: 75px;
            color: white;
            border: none;
        }

        .button:hover {
            background-color: #FF8C00;
        }

        .content {
            display: flex;
            align-items: center;
            gap: 16px;
            border: 2px;
            flex-wrap: wrap;
        }

        .card1 {
            width: 300px;
            height: 140px;
            border: 1px solid black;
            border-radius: 3px;
        }

        .card2 {
            width: 300px;
            height: 140px;
            border: 1px solid black;
            border-radius: 3px;
        }

        .card3 {
            width: 300px;
            height: 140px;
            border: 1px solid black;
            border-radius: 3px;
        }

        .kotak1 {
            height: 50px;
            width: 290px;
            margin-bottom: 20px;
            background-color: orange;
        }

        .kotak2 {
            height: 50px;
            width: 290px;
            margin-bottom: 20px;
            background-color: darkblue;
        }

        .kotak3 {
            height: 50px;
            width: 290px;
            margin-bottom: 20px;
            background-color: blueviolet;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">

        <div class="menu">
            <a href="#">Beranda</a>

        </div>

    <section class="hero">
        <h1>Selamat Datang di Situs Kami</h1>

        <button class="button">Mulai</button>
    </section>
